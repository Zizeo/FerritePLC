[workspace]
resolver = "3"
members = [
    "crates/ferrite-core",
    "crates/ferrite-ir",
    "crates/ferrite-lang-ld",
    "crates/ferrite-lang-sfc",
    "crates/ferrite-lang-st",
    "crates/ferrite-lang-fbd",
    "crates/ferrite-fieldbus-modbus",
    "crates/ferrite-fieldbus-iot",
    "crates/ferrite-hal",
    "crates/ferrite-project",
    "crates/ferrite-runtime",
    "crates/ferrite-twin",
    "crates/ferrite-gui",
    "crates/ferrite-cli",
]
default-members = ["crates/ferrite-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["FerritePLC Team"]

[workspace.dependencies]
ferrite-core = { path = "crates/ferrite-core" }
ferrite-ir = { path = "crates/ferrite-ir" }
ferrite-lang-ld = { path = "crates/ferrite-lang-ld" }
ferrite-lang-sfc = { path = "crates/ferrite-lang-sfc" }
ferrite-lang-st = { path = "crates/ferrite-lang-st" }
ferrite-lang-fbd = { path = "crates/ferrite-lang-fbd" }
ferrite-fieldbus-modbus = { path = "crates/ferrite-fieldbus-modbus" }
ferrite-fieldbus-iot = { path = "crates/ferrite-fieldbus-iot" }
ferrite-hal = { path = "crates/ferrite-hal" }
ferrite-project = { path = "crates/ferrite-project" }
ferrite-runtime = { path = "crates/ferrite-runtime" }
ferrite-twin = { path = "crates/ferrite-twin" }
ferrite-gui = { path = "crates/ferrite-gui" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
logos = "0.15"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
eframe = "0.31"
egui = "0.31"
egui_plot = "0.31"
iced = { version = "0.13", features = ["canvas", "tokio", "multi-window", "advanced"] }
rfd = "0.15"
quick-xml = { version = "0.37", features = ["serialize"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"
